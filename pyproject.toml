[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privateer-rtw3"
version = "0.1.0"
description = "A safety-first Rule the Waves 3 save editor"
requires-python = ">=3.11"

[project.scripts]
privateer = "privateer.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["privateer*"]
