name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - "packaging/RELEASE_VERSION"
      - "packaging/RELEASE_CHANNEL"
      - "packaging/RELEASE_TAG"
      - "packaging/RELEASE_NOTES.md"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Check release marker matches package version
        shell: pwsh
        run: |
          $version = python -c "from privateer.version import __version__; print(__version__)"
          $releaseVersion = (Get-Content packaging/RELEASE_VERSION -Raw).Trim()
          if ($releaseVersion -ne $version) {
            throw "Release marker $releaseVersion does not match package version $version"
          }
          $channel = (Get-Content packaging/RELEASE_CHANNEL -Raw).Trim()
          if ($channel -notin @("stable", "beta")) {
            throw "Release channel must be stable or beta"
          }

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "from privateer.version import __version__; print(__version__)"
          $channel = (Get-Content packaging/RELEASE_CHANNEL -Raw).Trim()
          $expectedTag = if ($channel -eq "beta") { "v$version-beta" } else { "v$version" }
          if (Test-Path packaging/RELEASE_TAG) { $expectedTag = (Get-Content packaging/RELEASE_TAG -Raw).Trim() }
          if ($expectedTag -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match release tag $expectedTag"
          }

      - name: Install release builder
        run: python -m pip install "pyinstaller>=6.0,<7"

      - name: Build portable Windows package
        shell: pwsh
        run: ./packaging/build_windows_release.ps1 -PythonExe python

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Privateer-Windows-x64
          path: release/Privateer-*-Windows-x64.zip
          if-no-files-found: error

      - name: Attach package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content packaging/RELEASE_VERSION -Raw).Trim()
          $channel = (Get-Content packaging/RELEASE_CHANNEL -Raw).Trim()
          $isBeta = $channel -eq "beta"
          $tag = if ($isBeta) { "v$version-beta" } else { "v$version" }
          if (Test-Path packaging/RELEASE_TAG) { $tag = (Get-Content packaging/RELEASE_TAG -Raw).Trim() }
          $title = if ($isBeta) { "Privateer $version Beta" } else { "Privateer $version" }
          $archive = Get-ChildItem release/Privateer-*-Windows-x64.zip | Select-Object -First 1
          if (gh release view $tag 2>$null) {
            if ($isBeta) {
              gh release edit $tag --prerelease --latest=false --title $title --notes-file packaging/RELEASE_NOTES.md
            } else {
              gh release edit $tag --prerelease=false --latest --title $title --notes-file packaging/RELEASE_NOTES.md
            }
            gh release upload $tag $archive.FullName --clobber
          } else {
            if ($isBeta) {
              gh release create $tag $archive.FullName --target "${{ github.sha }}" --notes-file packaging/RELEASE_NOTES.md --title $title --prerelease
            } else {
              gh release create $tag $archive.FullName --target "${{ github.sha }}" --notes-file packaging/RELEASE_NOTES.md --title $title
            }
          }
