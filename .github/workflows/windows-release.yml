name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "from privateer.version import __version__; print(__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version v$version"
          }

      - name: Install release builder
        run: python -m pip install "pyinstaller>=6.0,<7"

      - name: Build portable Windows package
        shell: pwsh
        run: ./packaging/build_windows_release.ps1 -PythonExe python

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Privateer-Windows-x64
          path: release/Privateer-*-Windows-x64.zip
          if-no-files-found: error

      - name: Attach package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Get-ChildItem release/Privateer-*-Windows-x64.zip | Select-Object -First 1
          if (gh release view "${{ github.ref_name }}" 2>$null) {
            gh release upload "${{ github.ref_name }}" $archive.FullName --clobber
          } else {
            gh release create "${{ github.ref_name }}" $archive.FullName --generate-notes --title "Privateer ${{ github.ref_name }} Beta"
          }
