name: Privateer release administration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/privateer-administration.yml']
permissions:
  contents: write
jobs:
  correct-release-titles:
    runs-on: ubuntu-latest
    steps:
      - name: Correct historical release titles without replacing binaries or tags
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          import json, os, urllib.request
          root = 'https://api.github.com/repos/' + os.environ['GH_REPO']
          def request(path, data=None):
              req = urllib.request.Request(root + path, data=None if data is None else json.dumps(data).encode(), method='GET' if data is None else 'PATCH', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          for tag, corrected, embedded in [
              ('v0.91', '0.9.1', '0.91'),
              ('v0.92', '0.9.2', '0.92'),
              ('v0.93-beta', '0.9.3 Beta', '0.93 Beta'),
              ('v0.932-beta-static-table', '0.9.3.2 Beta', '0.932 Beta'),
          ]:
              release = request('/releases/tags/' + tag)
              marker = '<!-- privateer-version-number-correction -->'
              disclaimer = (marker + '\n> **Version numbering correction:** This release is correctly named **Privateer ' + corrected + '**. The original program displays **' + embedded + '** because its version number was formatted incorrectly. This is a numbering mistake, not a different program version. Existing download filenames and Git tags retain their original names; the released binaries have not been changed.\n\n')
              body = release.get('body') or ''
              if marker not in body:
                  body = disclaimer + body
              updated = request('/releases/' + str(release['id']), {'name': 'Privateer ' + corrected, 'body': body})
              assert updated['name'] == 'Privateer ' + corrected and marker in updated['body']
              print(updated['name'] + ' — ' + tag)
