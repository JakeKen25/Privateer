name: Privateer milestone administration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/privateer-administration.yml']
permissions:
  contents: read
  issues: write
jobs:
  configure-roadmap:
    runs-on: ubuntu-latest
    steps:
      - name: Create ordered milestones and link implementation phases
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          import json, os, re, urllib.request
          root = 'https://api.github.com/repos/' + os.environ['GH_REPO']
          def request(path, data=None, method=None):
              req = urllib.request.Request(root + path, data=None if data is None else json.dumps(data).encode(), method=method or ('GET' if data is None else 'PATCH'), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          plan = json.loads(r'''{"milestones":[{"key":"released","title":"0.9.4 — Fortifications and technology controls","state":"closed","description":"Completed release: fortification management (#18), individual technology checkboxes (#24), and corrected release numbering (#26). Published Windows build: https://github.com/JakeKen25/Privateer/releases/tag/v0.9.4. Aircraft and fortification in-game validation continues separately in milestone 01."},{"key":"foundation","title":"01 — Reliability, tutorials, and verified data","state":"open","description":"First implementation stage. Rough effort: 10–20 focused developer-days, with extra time possible for reproducing game calculations; not a delivery-date commitment. Scope: current-version tutorials (#16), budget calculator accuracy (#22), in-game aircraft/fortification validation, documented war/alliance field research, and public-domain asset sourcing. Use existing guides and screenshots. Exit: tested save/backup/reload workflows, reconciled budget examples or clearly documented remaining estimates, multi-turn validation evidence, diplomacy field mappings, and an asset provenance inventory. Do not add unverified save-field writes. Photos/artwork must be verified public domain; no AI-generated images."},{"key":"submarines","title":"02 — Submarine management","state":"open","description":"After milestone 01's save-safety checks. Rough effort: 4–8 focused developer-days; format uncertainty may expand this. Scope: #19, a submarine roster and verified editing operations, with readable status, sorting, validation and backup support. Research all affected nation/record counters before enabling creation or removal. Exit: atomic edits, unrelated data preserved, and in-game load plus turn-advance checks across player and AI nations."},{"key":"diplomacy","title":"03 — Wars and alliances","state":"open","description":"After the diplomacy research task in milestone 01. Rough effort: 5–10 focused developer-days once mappings are confirmed. Scope: #21; reciprocal alliance and war/peace transitions, related state cleanup, supported combinations and clear UI. Reuse the existing diplomacy reference package. Exit: validated multi-nation transactions, backup/rollback coverage, and multiple in-game turns without broken diplomacy. Leave ambiguous transitions unavailable rather than guessing flag meanings."},{"key":"spawning","title":"04 — Ship spawning from built-in designs","state":"open","description":"First phase of #14. Rough effort: 7–12 focused developer-days. Depends on milestone 01's transaction/validation baseline; reuse the existing ship transfer design-copy and ID-remapping work. Scope: design selection, nation/ship defaults, fresh hull IDs and correct design references for supported built-in designs. Exit: save/reload and in-game turn checks, duplicates/counters tested, and unsupported aircraft-carrier or other linked-record cases explicitly gated. Custom-design importing follows in milestone 05."},{"key":"custom","title":"05 — Custom nations and custom-design spawning","state":"open","description":"After milestone 04. Rough combined effort: 12–25 focused developer-days, with scope revised after auditing the existing prototype. Scope: #17 and the remaining custom-design phase of #14. Resume and review feature/custom-nation-maker rather than rebuilding or discarding it. Preserve default ship naming CLASS-NUMBER (BB-01, KE-05, etc.), validate nation files/flags, and add custom-design selection with safe ID/reference handling. Exit: install/export validation, clean-game nation loading, representative ship spawning, migration guidance and regression checks. Use verified public-domain/user-supplied assets; replace any AI-generated placeholder imagery before release."},{"key":"polish","title":"06 — Public-domain visuals and documentation polish","state":"open","description":"After the functional managers stabilize and the sourcing task in milestone 01 is complete. Rough effort: 4–8 focused developer-days, excluding source clearance/research delays. Scope: #23 graphics/photos, #25 logo, and tutorials for the new managers. All photographic and artwork sources must have documented public-domain status; NO AI-generated imagery. Record source URL, creator/date when known, public-domain evidence and modifications. Do not treat search-result labels as proof. Exit: checked-in attribution/provenance, packaged assets, readable accessible UI at supported Windows scaling, and screenshots/tutorials matching the shipped program. No firm release dates assigned."}],"children":[{"key":"validation","title":"Validate Aircraft and Fortifications Managers in-game","milestone":"foundation","body":"Follow-up validation for completed #20 and #18; these original implementation issues remain closed.\n\n- [ ] Test representative aircraft roles and equivalent years, retaining the campaign design date.\n- [ ] Confirm generated aircraft can be used in-game and persist through multiple turns.\n- [ ] Test new and edited coastal/turreted/missile batteries, MTB squadrons, airship bases and airbase sizes across player and AI nations.\n- [ ] Verify aircraft-base links, capacity limits, maintenance behavior, Save/Save As and backup restore.\n- [ ] Record game version, reproducible steps, expected/actual results and any newly discovered bugs; use disposable save copies.\n\nEffort: roughly 2–4 developer-days plus game investigation if failures appear. Completion requires in-game evidence; editor round-trip tests alone are insufficient."},{"key":"diplomacy_research","title":"Verify war and alliance state transitions before editor implementation","milestone":"foundation","body":"Research phase for #21; implementation remains in milestone 03.\n\n- [ ] Reuse guides/DIPLOMACY.md and the original diplomacy reference package, including verified add-enemy and alliance findings.\n- [ ] Document reciprocal player/AI fields, global war state, coalition membership, alliance effects and cleanup needed for peace.\n- [ ] Capture before/after save differences for joining/leaving alliances and wars, across several nation pairs.\n- [ ] Advance multiple in-game turns and record unsupported/ambiguous transitions.\n- [ ] Produce synthetic regression fixtures and an explicit list of fields safe to edit.\n\nEffort: roughly 2–4 developer-days; uncertain engine interactions may require more. Do not implement guessed numeric meanings."},{"key":"assets","title":"Source and document public-domain photos and artwork","milestone":"foundation","body":"Sourcing phase for #23 and #25. Visual integration happens in milestone 06.\n\n- [ ] Identify candidate historical naval photos and suitable logo source material from authoritative collections.\n- [ ] For every asset, retain the source URL, creator/date when available, explicit public-domain evidence, original file and intended use.\n- [ ] Review jurisdiction/source restrictions; do not assume an image-search label proves public-domain status.\n- [ ] Record cropping, resizing and other non-generative edits and prepare an attribution/provenance inventory.\n- [ ] Select assets readable at the intended UI dimensions and reserve space before integration.\n\nNo AI-generated photos, illustrations, flags, or logo imagery. Images have not yet been sourced. Use public-domain source material and conventional layout/editing.\n\nEffort: roughly 1–3 developer-days; source verification may extend this."},{"key":"builtin_spawn","title":"Ship spawner phase 1: built-in designs","milestone":"spawning","body":"First implementation phase of parent #14. Custom designs are tracked in {{custom_spawn}} for milestone 05.\n\n- [ ] Inventory supported built-in designs and provide nation/design selection and a stat preview.\n- [ ] Reuse validated ship-transfer design copying/remapping; allocate fresh permanent hull IDs and correct local roster slots/counters.\n- [ ] Set explicit construction/status defaults without copying histories or stale commander/air-unit links.\n- [ ] Preserve unrelated save data and support staged Apply, Save/Save As and backups.\n- [ ] Gate unverified linked-record cases; test supported ship classes across nations, reload, then advance in-game turns.\n\nEffort: roughly 7–12 developer-days. Parent #14 stays open until both spawning phases are complete."},{"key":"custom_spawn","title":"Ship spawner phase 2: custom designs","milestone":"custom","body":"Second implementation phase of parent #14. Depends on {{builtin_spawn}}.\n\n- [ ] Support existing custom design files with format validation and a readable preview.\n- [ ] Validate nation compatibility and remap copied design IDs without collisions.\n- [ ] Reject incomplete or unsupported designs without partial save changes.\n- [ ] Reuse phase 1's staging, backup, validation and creation behavior.\n- [ ] Verify representative custom designs in-game, including save/reload and turn advancement, and document limitations.\n\nEffort: roughly 4–8 developer-days once phase 1 is stable. Work with #17 for custom-nation interoperability; do not merge its separate prototype branch prematurely."},{"key":"tutorial_refresh","title":"Extend tutorials for submarines, diplomacy, spawning and custom nations","milestone":"polish","body":"Follow-up to the current-version tutorials in #16; depends on milestones 02–05.\n\n- [ ] Add task-based walkthroughs for each newly implemented manager and custom-nation export/install.\n- [ ] Include screenshots of every referenced screen and setting, captured from the final UI.\n- [ ] Cover backups, unsupported cases, verification in-game and recovery from mistakes.\n- [ ] Reconcile documentation with the final imagery/layout and remove stale placeholder descriptions.\n\nScreenshots should show the actual application. Decorative photos/artwork must come from verified public-domain sources; do not generate images with AI.\n\nEffort: roughly 2–4 developer-days after the UI stabilizes."}],"originals":[{"number":16,"milestone":"foundation","text":"Prioritize tutorials for the currently shipped managers and first-run/settings/save/backup workflows. Reuse the existing Google Doc/manual screenshots and verify them against 0.9.4. Include every screen/setting referenced, and correct stale guide text such as the former fortification placeholder. Follow-up coverage of the future managers is tracked in {{tutorial_refresh}}. Rough effort: 2–4 developer-days for the current-version pass."},{"number":22,"milestone":"foundation","text":"Reconcile the budget calculator against controlled in-game examples, including rounding, research percentages, ship status/maintenance, construction, aircraft and fortification costs. Start with guides/ECONOMY.md and its documented discrepancy. Add regression fixtures and only write verified save fields. Retain the estimates disclaimer until the remaining differences are explained. Rough effort: 3–6 developer-days, possibly longer if the engine derives undocumented costs."},{"number":19,"milestone":"submarines","text":"Build a sortable submarine inventory and verified editing controls after documenting submarine records, nation ownership, status and counters. Add creation/removal only for operations whose dependent fields have been verified. Require atomic updates, backups, save/reload and in-game turn checks. Rough effort: 4–8 developer-days."},{"number":21,"milestone":"diplomacy","text":"Research and evidence are tracked in {{diplomacy_research}} (milestone 01). Implement the verified war/peace and alliance transitions in milestone 03, including reciprocal/global state, multi-nation validation and in-game turn tests. Do not extrapolate alliance meanings from raw numbers. Rough implementation effort: 5–10 developer-days after research."},{"number":14,"milestone":"custom","text":"Keep this as the overall ship-spawning feature and close it only after both phases are complete:\n- [ ] {{builtin_spawn}} — built-in designs, milestone 04.\n- [ ] {{custom_spawn}} — custom designs, milestone 05.\n\nThis parent is assigned to the final delivery milestone; the phase issues track earlier delivery. Reuse the existing ship-transfer format/ID-remapping work. Combined rough effort: 11–20 developer-days; avoid double-counting phase estimates."},{"number":17,"milestone":"custom","text":"Resume by auditing the existing feature/custom-nation-maker branch and its examples; preserve that work and do not merge it until it is reviewed and tested. Keep CLASS-NUMBER ship-name defaults (for example BB-01, KE-05, CV-30). Validate export/install, nation data, names and flags, and test compatibility with {{custom_spawn}}. Use verified public-domain/user-supplied flag artwork; do not ship AI-generated placeholders. Rough effort: 8–17 developer-days after prototype review, included in milestone 05's combined estimate."},{"number":23,"milestone":"polish","text":"Sourcing and public-domain evidence are tracked in {{assets}} (milestone 01). Integrate approved assets in milestone 06 once manager layouts stabilize. NO AI-generated imagery: use verified public-domain photos/artwork, retain source/provenance and modification records, and check UI readability and package size. Rough integration effort: 2–4 developer-days, excluding sourcing."},{"number":25,"milestone":"polish","text":"Create the logo using verified public-domain source material and conventional layout/editing; no AI-generated artwork. Coordinate source review through {{assets}} and visual integration with #23. Check small-size readability, light/dark backgrounds where relevant, and Windows icon/package inclusion. Rough effort: 1–2 developer-days after source selection."},{"number":18,"milestone":"released","text":"Shipped in Privateer 0.9.4: https://github.com/JakeKen25/Privateer/releases/tag/v0.9.4 . Further in-game validation is tracked in {{validation}}; retain this implementation issue's closed state."},{"number":24,"milestone":"released","text":"Shipped in Privateer 0.9.4: cumulative research sliders plus independent technology checkboxes and preserved exceptions. Release: https://github.com/JakeKen25/Privateer/releases/tag/v0.9.4 ."},{"number":26,"milestone":"released","state":"closed","text":"Completed: the new application displays 0.9.4. Historical release titles are corrected to 0.9.1, 0.9.2, 0.9.3 Beta and 0.9.3.2 Beta, with disclaimers explaining their embedded 0.91, 0.92, 0.93 Beta and 0.932 Beta version mistakes. Existing historical tags and binaries are preserved. Verified each corrected release title and disclaimer."}]}''')
          existing = request('/milestones?state=all&per_page=100')
          milestones = {}
          for item in plan['milestones']:
              match = next((m for m in existing if m['title'] == item['title']), None)
              data = {key:item[key] for key in ('title','description','state')}
              result = request('/milestones/' + str(match['number']), data) if match else request('/milestones', data, 'POST')
              milestones[item['key']] = result['number']
          issues = request('/issues?state=all&per_page=100')
          children = {}
          for item in plan['children']:
              marker = '<!-- privateer-roadmap-child:' + item['key'] + ' -->'
              match = next((i for i in issues if marker in (i.get('body') or '')), None)
              if match is None:
                  body = marker + '\n\n' + re.sub(r'\{\{[a-z_]+\}\}', 'linked implementation phase', item['body'])
                  match = request('/issues', {'title':item['title'], 'body':body, 'milestone':milestones[item['milestone']]}, 'POST')
              children[item['key']] = match['number']
          def resolve(text):
              return re.sub(r'\{\{([a-z_]+)\}\}', lambda m:'#' + str(children[m.group(1)]), text)
          for item in plan['children']:
              marker = '<!-- privateer-roadmap-child:' + item['key'] + ' -->'
              request('/issues/' + str(children[item['key']]), {'title':item['title'], 'body':marker + '\n\n' + resolve(item['body']), 'milestone':milestones[item['milestone']]})
          for item in plan['originals']:
              current = request('/issues/' + str(item['number']))
              marker = '<!-- privateer-roadmap -->'
              original = (current.get('body') or '').split(marker)[0].rstrip()
              body = original + ('\n\n' if original else '') + marker + '\n## Implementation plan\n\n' + resolve(item['text'])
              data = {'milestone':milestones[item['milestone']], 'body':body}
              if item.get('state'):
                  data.update(state=item['state'], state_reason='completed')
              request('/issues/' + str(item['number']), data)
          for item in plan['milestones']:
              actual = request('/milestones/' + str(milestones[item['key']]))
              assert actual['title'] == item['title']
              print(json.dumps({'milestone':actual['title'], 'number':actual['number'], 'state':actual['state'], 'open_issues':actual['open_issues'], 'closed_issues':actual['closed_issues'], 'url':actual['html_url']}))
          print('FOLLOW_UP_ISSUES=' + json.dumps(children))
          
