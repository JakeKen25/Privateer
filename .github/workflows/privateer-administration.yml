name: Assign proposed roadmap versions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/privateer-administration.yml']
permissions:
  contents: read
  issues: write
jobs:
  update-roadmap:
    runs-on: ubuntu-latest
    steps:
      - name: Set proposed versions and add AAR Logger after visual polish
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          import json, os, urllib.request
          root = 'https://api.github.com/repos/' + os.environ['GH_REPO']
          def request(path, data=None, method=None):
              req = urllib.request.Request(root + path, data=None if data is None else json.dumps(data).encode(), method=method or ('GET' if data is None else 'PATCH'), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          plan = json.loads(r'''{"policy":"Proposed product-release version, not a scheduled or published release. Privateer uses MAJOR.MINOR.PATCH: major product expansions get a new major number by owner policy; compatible features increment minor; fixes and cosmetic/documentation-only adjustments increment patch. This is product-release numbering, not a claim of strict Semantic Versioning: SemVer reserves major bumps for incompatible public-interface changes. Reset lower components on a major/minor bump, document any actual compatibility breaks, and use prerelease suffixes such as 3.0.0-beta.1 rather than a fourth numeric component. Do not overwrite previously published binaries. Reassess targets if scope or release order changes.","targets":[{"number":2,"version":"0.9.5","title":"01 — 0.9.5 — Reliability, tutorials, and verified data","reason":"Patch target: fixes, validation, tutorials and research; no new runtime feature is planned in this stage."},{"number":3,"version":"0.10.0","title":"02 — 0.10.0 — Submarine management","reason":"Minor target: new submarine-management functionality. Version components are integers; 0.10.0 follows 0.9.x."},{"number":4,"version":"0.11.0","title":"03 — 0.11.0 — Wars and alliances","reason":"Minor target: new relationship-management features."},{"number":5,"version":"1.0.0","title":"04 — 1.0.0 — Ship spawning from built-in designs","reason":"Major product-release target: first ship-spawning phase and the 1.0 readiness checkpoint. Validate supported workflows and document compatibility expectations before declaring 1.0.0; custom-design spawning remains in the following milestone."},{"number":6,"version":"2.0.0","title":"05 — 2.0.0 — Custom nations and custom-design spawning","reason":"Major product-release target: custom-nation creation and completion of custom-design spawning. The bump reflects the owner's major-feature policy, not an assertion that existing saves will become incompatible."},{"number":7,"version":"2.0.1","title":"06 — 2.0.1 — Public-domain visuals and documentation polish","reason":"Patch target while scope is presentation, asset replacement and documentation only. If this grows into new user-facing functionality, revise to 2.1.0. Preserve the public-domain-only and no-AI-imagery requirements."}],"description":"Proposed target: 3.0.0 — major product release, after milestone 06 (visuals and documentation polish). Scope: #33, a tool to make exporting battle after-action reports easier. Detailed requirements are pending from the owner. First define report sources, fields, export formats, workflow and acceptance criteria; then estimate and split implementation as needed. The issue's possible Pro/Supabase add-in is an exploratory idea, not a committed requirement. Do not assume cloud storage, subscriptions, external uploads or paid functionality. Effort and due date: TBD until requirements are supplied. Any imagery must follow the existing verified-public-domain, no-AI-generated policy.\n\nProposed product-release version, not a scheduled or published release. Privateer uses MAJOR.MINOR.PATCH: major product expansions get a new major number by owner policy; compatible features increment minor; fixes and cosmetic/documentation-only adjustments increment patch. This is product-release numbering, not a claim of strict Semantic Versioning: SemVer reserves major bumps for incompatible public-interface changes. Reset lower components on a major/minor bump, document any actual compatibility breaks, and use prerelease suffixes such as 3.0.0-beta.1 rather than a fourth numeric component. Do not overwrite previously published binaries. Reassess targets if scope or release order changes.","body":"Maybe have a pro version addin that links to supabase?\n\n<!-- privateer-aar-roadmap -->\n## Roadmap placement\n\nMilestone 07, proposed version **3.0.0**, follows visuals and documentation polish and is designated a major product release.\n\nPurpose: make it easier to export after-action reports for battles. Detailed requirements will be supplied later; export formats, data sources, user workflow and effort estimates remain TBD. The possible Pro/Supabase add-in above is exploratory, not a confirmed dependency or authorization to upload battle data.\n\nVersioning follows the product-release policy documented on the milestone; no release or implementation is being started by this planning update.","issue":33,"title":"07 — 3.0.0 — AAR Logger"}''')
          marker = '<!-- privateer-proposed-version -->'
          for item in plan['targets']:
              old = request('/milestones/' + str(item['number']))
              original = (old.get('description') or '').split(marker)[0].rstrip()
              description = original + '\n\n' + marker + '\nProposed version: ' + item['version'] + '. ' + item['reason'] + '\n\n' + plan['policy']
              result = request('/milestones/' + str(item['number']), {'title':item['title'], 'description':description})
              assert result['title'] == item['title']
              print(result['title'])
          existing = request('/milestones?state=all&per_page=100')
          match = next((m for m in existing if 'AAR Logger' in m['title']), None)
          payload = {'title':plan['title'],'description':plan['description'],'state':'open'}
          aar = request('/milestones/' + str(match['number']), payload) if match else request('/milestones',payload,'POST')
          issue = request('/issues/' + str(plan['issue']))
          original = (issue.get('body') or '').split('<!-- privateer-aar-roadmap -->')[0].rstrip()
          note = plan['body'].split('<!-- privateer-aar-roadmap -->',1)[1]
          updated = request('/issues/' + str(plan['issue']), {'milestone':aar['number'], 'body':original+'\n\n<!-- privateer-aar-roadmap -->'+note})
          assert updated['milestone']['number'] == aar['number']
          print(json.dumps({'aar_milestone':aar['number'],'title':aar['title'],'issue':updated['number']}))
          
